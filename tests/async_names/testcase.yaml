common:
  tags: lua_zephyr
  platform_allow: native_sim
  integration_platforms:
    - native_sim
  harness: console
tests:
  lua_zephyr.async_names.basenames:
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "^a/foo ran"
        - "^b/foo ran"
        - "^my-file ran"
  lua_zephyr.async_names.fs_path:
    extra_args:
      - ASYNC_NAMES_FS=1
    extra_configs:
      - CONFIG_FILE_SYSTEM=y
      - CONFIG_LUA_FS=y
    harness_config:
      type: one_line
      regex:
        - 'cannot open /lfs/dir "q"/back\\slash\.lua'
