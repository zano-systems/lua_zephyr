CONFIG_LUA=y
CONFIG_LUA_ASYNC=y
CONFIG_LUA_LIBS_ALL=y
CONFIG_LUA_ALLOC_STATS=y

CONFIG_LUA_ASYNC_MAX_TASKS=32
CONFIG_LUA_ASYNC_MAX_READERS=40

CONFIG_BENCH_LUA_THREAD_STACK_SIZE=8192
CONFIG_BENCH_LUA_THREAD_HEAP_SIZE=65536

CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_ASSERT=n

# Lua thread execution cycles (excludes idle and the publisher).
CONFIG_THREAD_RUNTIME_STATS=y

# What zview reads (see the zview snippet).
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
