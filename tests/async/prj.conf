CONFIG_LUA=y
CONFIG_LUA_ASYNC=y
CONFIG_LUA_LIBS_ALL=y

CONFIG_SUITE_LUA_THREAD_STACK_SIZE=16384
CONFIG_SUITE_LUA_THREAD_HEAP_SIZE=196608

# Exact millisecond timestamps in test_sched need a fine tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# printk must reach the console hook directly so tests can capture reports.
CONFIG_LOG=n

CONFIG_BOOT_BANNER=n
CONFIG_ASSERT=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SYS_HEAP_ARRAY_SIZE=1
CONFIG_THREAD_NAME=y
