  <text x="575" y="408" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Input S2</text>
  <rect x="1095" y="359" width="150" height="82" rx="6" fill="#3a8aef"/>
  <text x="1170" y="408" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Output S1</text>
  <rect x="195" y="525" width="240" height="205" rx="10" fill="#e6e6e6"/>
  <text x="315" y="585" text-anchor="middle" font-size="24" font-weight="700" fill="#222222">Service 1</text>
  <text x="315" y="647" text-anchor="middle" font-size="21" fill="#222222">Hardware</text>
  <text x="315" y="677" text-anchor="middle" font-size="21" fill="#222222">dependent code</text>
  <rect x="455" y="525" width="240" height="205" rx="10" fill="#e6e6e6"/>
