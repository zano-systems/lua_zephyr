sample:
  name: Async tasks from separate files
common:
  tags: lua_zephyr
  integration_platforms:
    - mps2/an385
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "^alpha done"
      - "^beta done"
      - "^gamma done"
      - "^delta done"
      - "^epsilon done"
      - "^zeta done"
      - "^eta done"
      - "^theta done"
      - "^iota done"
      - "^kappa done"
      - "^lambda done"
      - "^mu done"
      - "^nu done"
      - "^xi done"
      - "^omicron done"
      - "^pi done"
      - "heap:\\s+\\d{4,5}\\s+\\d+\\s+\\d+\\s+\\d+%"
tests:
  sample.lua_zephyr.async_files: {}
  sample.lua_zephyr.async_files.precompile_only:
    extra_args:
      - ASYNC_BYTECODE=1
    extra_configs:
      - CONFIG_LUA_PRECOMPILE=y
      - CONFIG_LUA_PRECOMPILE_ONLY=y
